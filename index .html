 <!DOCTYPE html>
<html>
<head>
    <title>AIML Student Skill Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AIML Student Skill Tracker</h1>
        <p>B.Tech AIML Mini Project</p>

        <div class="card">
            <h2>Student Information</h2>

            <input type="text" id="studentName" placeholder="Enter your name">

            <input type="number" id="semester" placeholder="Enter semester">

            <button onclick="startProject()">Start Project</button>
        </div>

        <div id="dashboard"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
